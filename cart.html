<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — Sussi Loom</title>
<meta name="description" content="Your Sussi Loom cart.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cart">
<div id="header"></div>
<main>
  <section class="page-head" style="padding:60px 0 50px">
    <div class="wrap"><div class="crumbs"><a href="index.html">Home</a> / Cart</div><h1>Your cart</h1></div>
  </section>
  <div class="wrap" id="cart-root"></div>
</main>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("sl:ready", () => {
  const root = document.getElementById("cart-root");
  function render() {
    const lines = SL.Cart.lines();
    if (!lines.length) {
      root.innerHTML = `<div class="empty">
        <svg viewBox="0 0 180 140" fill="none" stroke="#a77a45" stroke-width="1.3" stroke-linecap="round"><path d="M40 50h100l-8 76H48L40 50Z"/><path d="M68 50V38a22 22 0 0 1 44 0v12"/><path d="M70 90c6 6 34 6 40 0" stroke-dasharray="3 4"/><path d="M20 120c30-6 110-6 140 0" opacity=".4"/></svg>
        <h2>Nothing on the loom yet.</h2>
        <p style="margin:14px 0 30px">Your cart is empty — let's find you a weave.</p>
        <a class="btn" href="shop.html" data-arrow>Shop sussi</a></div>`;
      root.querySelectorAll("[data-arrow]").forEach(el => el.insertAdjacentHTML("beforeend", SL.I.arrow));
      return;
    }
    const t = SL.Cart.totals();
    const left = Math.max(0, SL.FREE_SHIP - t.sub);
    root.innerHTML = `<div class="cart-layout">
      <div>
        ${lines.map(l => `<div class="line-item">
          <a class="thumb" href="product.html?id=${l.p.id}">${SL.swatch(l.p, "drape")}</a>
          <div><a href="product.html?id=${l.p.id}"><h4>${l.p.name}</h4></a><small>${l.p.sub}${l.size ? " · Size " + l.size : ""}</small>
            <small>${SL.pkr(l.p.price)}</small>
            <div style="display:flex;gap:20px;align-items:center;margin-top:12px;flex-wrap:wrap">
              <div class="qty"><button data-dec="${l.key}" aria-label="Less">−</button><input value="${l.qty}" readonly aria-label="Quantity"><button data-inc="${l.key}" aria-label="More">+</button></div>
              <button class="remove" data-rm="${l.key}">Remove</button>
            </div></div>
          <div class="price" style="font-family:var(--serif);font-size:1.25rem;color:var(--brown)">${SL.pkr(l.p.price * l.qty)}</div>
        </div>`).join("")}
        <a class="link" href="shop.html" style="margin-top:30px" data-arrow>Continue shopping</a>
      </div>
      <aside class="summary">
        <h3>Order summary</h3>
        <p style="font-size:.85rem">${left ? `You're <b style="color:var(--brown)">${SL.pkr(left)}</b> away from free shipping.` : `<span class="hand" style="font-size:1.3rem">Shipping's on us ✓</span>`}</p>
        <div class="ship-meter"><i style="width:${Math.min(100, t.sub / SL.FREE_SHIP * 100)}%"></i></div>
        <div class="sum-row"><span>Subtotal</span><span>${SL.pkr(t.sub)}</span></div>
        <div class="sum-row"><span>Shipping</span><span>${t.ship ? SL.pkr(t.ship) : "Free"}</span></div>
        <div class="sum-row total"><span>Total</span><span>${SL.pkr(t.total)}</span></div>
        <a class="btn block" href="checkout.html" style="margin-top:24px" data-arrow>Checkout</a>
        <p style="font-size:.78rem;margin-top:16px;text-align:center">Cash on delivery · Bank transfer · JazzCash / Easypaisa</p>
      </aside></div>`;
    root.querySelectorAll("[data-arrow]").forEach(el => el.insertAdjacentHTML("beforeend", SL.I.arrow));
  }
  root.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const lines = SL.Cart.items();
    if (b.dataset.rm) SL.Cart.remove(b.dataset.rm);
    if (b.dataset.inc) { const l = lines.find(x => x.key === b.dataset.inc); SL.Cart.setQty(l.key, l.qty + 1); }
    if (b.dataset.dec) { const l = lines.find(x => x.key === b.dataset.dec); SL.Cart.setQty(l.key, l.qty - 1); }
    render();
  });
  render();
});
</script>
</body>
</html>
