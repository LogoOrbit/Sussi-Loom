<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sussi Loom</title>
<meta name="description" content="Handwoven sussi from Sussi Loom.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="header"></div>
<main class="wrap" id="pdp-root"></main>
<section class="sec cream">
  <div class="wrap">
    <div class="head-row"><div><span class="eyebrow">You may also love</span><div class="divider">✦</div><h2>More from the loom</h2></div><a class="link" href="shop.html" data-arrow>All sussi</a></div>
    <div class="grid" id="related"></div>
  </div>
</section>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("sl:ready", () => {
  const id = new URLSearchParams(location.search).get("id");
  const p = SL.byId(id) || SL.P[0];
  document.title = p.name + " — Sussi Loom";
  const views = ["drape", "close", "flat", "folded"];
  const root = document.getElementById("pdp-root");
  root.innerHTML = `
    <div class="crumbs" style="padding-top:34px"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <a href="shop.html?cat=${p.cat}">${SL_CATS[p.cat]}</a> / ${p.name}</div>
    <div class="pdp">
      <div class="gallery">
        <div class="thumbs">${views.map((v, i) => `<button class="${i ? "" : "on"}" data-v="${v}" aria-label="View ${v}">${SL.swatch(p, v)}</button>`).join("")}</div>
        <div class="main-img" id="main">${SL.swatch(p, "drape")}</div>
      </div>
      <div>
        <span class="eyebrow">${SL_CATS[p.cat]}${p.badge ? " · " + p.badge : ""}</span>
        <h1 style="margin-top:12px">${p.name}</h1>
        <div class="sub" style="color:var(--muted);margin-top:6px">${p.sub}</div>
        <div class="price">${SL.pkr(p.price)}</div>
        <p class="lead">${p.desc}</p>
        <span class="opt-label">The threads in this weave</span>
        <div class="dots">${[...new Set(p.weave.map(w => w[0]))].map(c => `<i style="background:${c};width:22px;height:22px"></i>`).join("")}</div>
        ${p.sizes ? `<span class="opt-label">Size <a href="#size" style="text-transform:none;letter-spacing:0;color:var(--muted);border-bottom:1px solid var(--line);margin-left:8px">size guide</a></span>
          <div class="sizes" id="sizes">${p.sizes.map(s => `<button data-s="${s}">${s}</button>`).join("")}</div><p id="size-err" style="color:#a33;font-size:.8rem;margin-top:8px;display:none">Please choose a size.</p>` : ""}
        <span class="opt-label">Quantity</span>
        <div class="qty"><button id="minus" aria-label="Less">−</button><input id="qty" value="1" inputmode="numeric" aria-label="Quantity"><button id="plus" aria-label="More">+</button></div>
        <div class="buy-row">
          <button class="btn" id="add">Add to cart</button>
          <button class="btn ghost" id="buy">Buy it now</button>
        </div>
        <a class="link" style="margin-top:22px" target="_blank" rel="noopener" href="https://wa.me/${SL.WA}?text=${encodeURIComponent("Hi Sussi Loom, I'm interested in " + p.name + " (" + SL.pkr(p.price) + "). " + location.href)}" data-arrow>Ask about this on WhatsApp</a>
        <div class="assure">
          <div><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10h4l2 3v4h-6"/></svg>Free shipping over PKR 7,000</div>
          <div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 10h18"/></svg>Cash on delivery</div>
          <div><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>7-day exchange</div>
        </div>
        <div class="spec">
          <details open><summary>Fabric &amp; length</summary><ul><li>${p.fabric}</li><li>${p.length}</li><li>Woven on a hand-operated loom in Sindh / southern Punjab</li></ul></details>
          <details><summary>Why it looks slightly uneven</summary><p>Sussi is woven by hand, so stripes can wander a hair's width and shades can shift slightly between batches. That is the signature of the loom — no two lengths are identical.</p></details>
          <details id="size"><summary>Size guide</summary><p>XS 34" · S 36" · M 38" · L 40" · XL 42" (chest). Kurtas are cut relaxed — if between sizes, go down. Message us your measurements and we'll advise.</p></details>
          <details><summary>Care</summary><p>Cold hand wash or gentle machine wash. Wash separately the first time. Dry in shade, iron on medium. Do not bleach.</p></details>
          <details><summary>Delivery &amp; exchange</summary><p>Karachi 2–3 working days, rest of Pakistan 3–5. Exchange within 7 days for unworn, uncut pieces.</p></details>
        </div>
      </div>
    </div>`;

  let size = null;
  const qty = document.getElementById("qty");
  const clamp = v => Math.max(1, Math.min(10, parseInt(v) || 1));
  document.getElementById("minus").onclick = () => qty.value = clamp(qty.value - 1);
  document.getElementById("plus").onclick = () => qty.value = clamp(+qty.value + 1);
  qty.onchange = () => qty.value = clamp(qty.value);
  document.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".thumbs button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("main").innerHTML = SL.swatch(p, b.dataset.v);
  });
  const sizes = document.getElementById("sizes");
  if (sizes) sizes.onclick = e => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    sizes.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); size = b.dataset.s;
    document.getElementById("size-err").style.display = "none";
  };
  function add() {
    if (p.sizes && !size) { document.getElementById("size-err").style.display = "block"; return false; }
    SL.Cart.add(p.id, clamp(qty.value), size);
    return true;
  }
  document.getElementById("add").onclick = () => { if (add()) SL.toast(`<span>${p.name}${size ? " (" + size + ")" : ""} added</span><a href="cart.html">View cart</a>`); };
  document.getElementById("buy").onclick = () => { if (add()) location.href = "checkout.html"; };

  const rel = SL.P.filter(x => x.id !== p.id).sort((a, b) => (b.cat === p.cat) - (a.cat === p.cat)).slice(0, 4);
  document.getElementById("related").innerHTML = rel.map(x => SL.card(x)).join("");
  SL.reveal();
});
</script>
</body>
</html>
