<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sussi Loom</title>
<meta name="description" content="Handwoven sussi from Sussi Loom.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="header"></div>
<main class="wrap" id="pdp-root"></main>
<section class="sec cream">
  <div class="wrap">
    <div class="head-row"><div><span class="eyebrow">You may also love</span><div class="divider">✦</div><h2>More from the loom</h2></div><a class="link" href="shop.html" data-arrow>Full collection</a></div>
    <div class="grid" id="related"></div>
  </div>
</section>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("sl:ready", () => {
  const id = new URLSearchParams(location.search).get("id");
  const p = SL.byId(id) || SL.P[0];
  document.title = p.name + " — Sussi Loom";
  const views = [p.view || "drape", "close", "drape", "flat", "folded", "kurta", "cushion"].filter((v, i, arr) => arr.indexOf(v) === i)
    .filter(v => (v !== "kurta" || p.view === "kurta") && (v !== "cushion" || p.view === "cushion")).slice(0, 4);
  const colours = [...new Set(p.weave.map(w => w[0]))];
  const msg = "Hi Sussi Loom, please message me when " + p.name + " (" + p.sub + ") launches. " + location.href;
  const root = document.getElementById("pdp-root");
  root.innerHTML = `
    <div class="crumbs" style="padding-top:34px"><a href="index.html">Home</a> / <a href="shop.html">Collection</a> / <a href="shop.html?cat=${p.cat}">${SL_CATS[p.cat]}</a> / ${p.name}</div>
    <div class="pdp">
      <div class="gallery">
        <div class="thumbs">${views.map((v, i) => `<button class="${i ? "" : "on"}" data-v="${v}" aria-label="View ${v}">${SL.swatch(p, v)}</button>`).join("")}</div>
        <div class="main-img" id="main">${SL.swatch(p, views[0])}</div>
      </div>
      <div>
        <span class="eyebrow">${SL_CATS[p.cat]}${p.badge ? " · " + p.badge : ""}</span>
        <h1 style="margin-top:12px">${p.name}</h1>
        <div class="sub" style="color:var(--muted);margin-top:6px">${p.sub} · woven in ${p.origin}</div>
        <div class="soon lg">Coming soon · price at launch</div>
        <p class="lead">${p.desc}</p>
        <span class="opt-label">The threads in this weave</span>
        <div class="thread-list">${colours.map((c, i) => `<span><i style="background:${c}"></i>${p.threads[i] || ""}</span>`).join("")}</div>
        ${p.sizes ? `<span class="opt-label">Sizes at launch</span><div class="sizes">${p.sizes.map(x => `<button type="button" tabindex="-1" style="cursor:default">${x}</button>`).join("")}</div>` : ""}
        <div class="buy-row">
          <button class="btn" data-wish="${p.id}">♡ Save for launch</button>
          <a class="btn ghost" target="_blank" rel="noopener" href="${SL.waLink(msg)}">Notify me on WhatsApp</a>
        </div>
        <table class="spec-table">
          <tr><th>Woven in</th><td>${p.origin}</td></tr>
          <tr><th>Cloth</th><td>${p.fabric}</td></tr>
          <tr><th>Weight</th><td>${p.weight}</td></tr>
          ${p.width !== "—" ? `<tr><th>Loom width</th><td>${p.width}</td></tr>` : ""}
          <tr><th>What you get</th><td>${p.length}</td></tr>
          <tr><th>Time on the loom</th><td>${p.loom}</td></tr>
          ${p.check ? `<tr><th>Weave</th><td>Chaarkhana — stripes run both ways to form a check</td></tr>` : ""}
          <tr><th>Wear it with</th><td>${p.pair}</td></tr>
        </table>
        <div class="spec">
          <details><summary>Why it looks slightly uneven</summary><p>Sussi is woven by hand, so a stripe can wander a hair's width and the shade can shift slightly between dye batches. The piece you get may not match the drawing above exactly. No two lengths are identical.</p></details>
          ${p.sizes ? `<details id="size"><summary>Size guide</summary><p>Chest: XS 34" · S 36" · M 38" · L 40" · XL 42" · XXL 44". Cut relaxed — if you're between sizes, go down. Send us your measurements on WhatsApp and we'll advise.</p></details>` : ""}
          <details><summary>Care</summary><p>First wash alone in cold water — expect a little dye to run, once. After that, gentle machine wash cold, dry in shade, iron medium on the reverse. No bleach.${/silk|zari/i.test(p.fabric) ? " Zari lines: iron on the reverse only." : ""}</p></details>
          <details><summary>Launch &amp; delivery</summary><p>Prices go live on launch day. Saved and WhatsApp-list customers hear first. Delivery across Pakistan: Karachi 2–3 working days, other cities 3–5. Cash on delivery available.</p></details>
        </div>
      </div>
    </div>`;

  document.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".thumbs button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("main").innerHTML = SL.swatch(p, b.dataset.v);
  });

  const rel = SL.P.filter(x => x.id !== p.id).sort((a, b) => (b.cat === p.cat) - (a.cat === p.cat)).slice(0, 4);
  document.getElementById("related").innerHTML = rel.map(x => SL.card(x)).join("");
  SL.updateCount();
  SL.reveal();
});
</script>
</body>
</html>
