<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Wishlist — Sussi Loom</title>
<meta name="description" content="The Sussi Loom weaves you've saved for launch.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="wishlist">
<div id="header"></div>
<main>
  <section class="page-head" style="padding:60px 0 50px">
    <div class="wrap"><div class="crumbs"><a href="index.html">Home</a> / Wishlist</div><h1>Saved for launch</h1><p>Nothing is on sale yet. Send us this list and we'll message you the moment these pieces go live — with prices.</p></div>
  </section>
  <div class="wrap" id="cart-root"></div>
</main>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("sl:ready", () => {
  const root = document.getElementById("cart-root");
  const arrows = () => root.querySelectorAll("[data-arrow]").forEach(el => el.insertAdjacentHTML("beforeend", SL.I.arrow));
  function render() {
    const items = SL.Wish.items();
    if (!items.length) {
      root.innerHTML = `<div class="empty">
        <svg viewBox="0 0 180 140" fill="none" stroke="#a77a45" stroke-width="1.3" stroke-linecap="round"><path d="M90 118S40 88 40 56a24 24 0 0 1 50-8 24 24 0 0 1 50 8c0 32-50 62-50 62Z"/><path d="M62 56h56M62 66h56M62 76h56" stroke-dasharray="3 4"/><path d="M20 130c30-6 110-6 140 0" opacity=".4"/></svg>
        <h2>Nothing saved yet.</h2>
        <p style="margin:14px 0 30px">Tap “Save for launch” on any weave and it'll wait here.</p>
        <a class="btn" href="shop.html" data-arrow>Preview the collection</a></div>`;
      arrows(); return;
    }
    const msg = "Hi Sussi Loom, please message me when these launch:\n" + items.map(p => "• " + p.name + " — " + p.sub).join("\n");
    root.innerHTML = `<div class="cart-layout">
      <div>
        ${items.map(p => `<div class="line-item">
          <a class="thumb" href="product.html?id=${p.id}">${SL.swatch(p)}</a>
          <div><a href="product.html?id=${p.id}"><h4>${p.name}</h4></a><small>${p.sub} · ${p.origin}</small>
            <small>${p.threads.join(" · ")}</small>
            <button class="remove" data-rm="${p.id}">Remove</button></div>
          <div class="soon">Coming soon</div>
        </div>`).join("")}
        <a class="link" href="shop.html" style="margin-top:30px" data-arrow>Keep browsing</a>
      </div>
      <aside class="summary">
        <h3>${items.length} ${items.length === 1 ? "weave" : "weaves"} saved</h3>
        <p style="font-size:.9rem">Runs are 20–40 lengths per weave, and the limited ones are smaller. Sending this list means we hold your place in line on launch day.</p>
        <a class="btn block" target="_blank" rel="noopener" href="${SL.waLink(msg)}" style="margin-top:24px" data-arrow>Send list on WhatsApp</a>
        <p style="font-size:.78rem;margin-top:16px;text-align:center">Saved in this browser only · ${SL.PHONE}</p>
      </aside></div>`;
    arrows();
  }
  root.addEventListener("click", e => {
    const b = e.target.closest("[data-rm]"); if (!b) return;
    SL.Wish.remove(b.dataset.rm); render();
  });
  render();
});
</script>
</body>
</html>
